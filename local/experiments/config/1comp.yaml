---
description: 単一区画の Traub で、群分けと縮約の仕方を比べる実験群
---
# 基準のファイル（parts/ の学習器、inputs/ の系列。送る形そのまま）を名前か差分 { name, from, ...差分 } で指す。part・input はどの学習器・系列にも重ねる差分。欄の形は ../schema/schema.ts の FIELDS。
base:
  parts: [kam, kam-absorb-m, pca-sindy, ae-sindy]
  inputs: [traub-1comp-steady]
runs:
  all-groupings-1comp:
    groupings: { all: [h, n, a, c] }
  fluctuating-input-1comp:
    parts: [kam, pca-sindy, ae-sindy]
    groupings: [h+n]
    inputs: [traub-1comp-steady, traub-1comp-kistler]
  test-1comp:
    parts: [kam, pca-sindy, ae-sindy]
    part: { data: { current_params: { duration: 1000 } } }
    groupings: [h+n_a+c]
    inputs:
      - {
          name: traub-1comp-steady-test,
          from: traub-1comp-steady,
          spec: { current_params: { duration: 100.0 } },
          values: [0, 10],
        }
