---
description: 単一区画の Traub で、群分けと縮約の仕方を比べる実験群
---
# 一段目（presets.json の base と部品）の上に、この群の基準 base を重ねる。実験は vary に挙げた欄だけを書き換える。欄の形は ../schema/schema.ts の PARAMS。
base:
  methods: [kam, kam-absorb-m, pca-sindy, ae-sindy]
  series: [traub-1comp-steady]
vary: [methods, groupings, train, series]
runs:
  all-groupings-1comp:
    groupings: { all: [h, n, a, c] }
  fluctuating-input-1comp:
    methods: [kam, pca-sindy, ae-sindy]
    groupings: [h+n]
    series: [traub-1comp-steady, traub-1comp-kistler]
  test-1comp:
    methods: [kam, pca-sindy, ae-sindy]
    groupings: [h+n_a+c]
    train: { duration: 1000 }
    series:
      - { name: traub-1comp-steady-test, from: traub-1comp-steady, duration: 100.0, sweep: { value: [0, 10] } }
