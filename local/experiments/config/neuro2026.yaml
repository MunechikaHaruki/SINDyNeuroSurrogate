---
description: NEURO2026 で発表した形を今の研究コードで回し直す実験群
---
# 実験ごとに欄を全部書く。learners は学習器の名前 <圧縮器>-<右辺>[-d<潜在>][-absorb-<ゲート>]（圧縮器と右辺が同じなら 1 語）。
# inputs は系列の基準（input.json）からの差分で、掃引 sweep: { <電流パラメータ>: [値...] } と置き換える区画 replace_targets も書く。系列の名前は <細胞>-<電流の種類>@<区画> と中身から付く。
# train は学習の電流への差分、bench の series は系列の名前。欄の形は ../schema/schema.ts。実験どうしで同じものは YAML のアンカー（&名前・*名前）で使い回す。
experiments:
  neuro2026-rerun:
    learners: [ae-sindy-d5]
    train: { target: traub19, current_params: { duration: 1000 } }
    groupings: [m+h+n+a+b+c]
    inputs:
      - { spec: { target: traub19 }, sweep: { value: [0, 2.5, 5, 7.5, 10] } }
