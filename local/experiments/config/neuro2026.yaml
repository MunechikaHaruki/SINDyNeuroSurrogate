---
description: NEURO2026 で発表した形を今の研究コードで回し直す実験群
---
# 一段目（presets.json の base と部品）の上に、この群の基準 base を重ねる。実験は vary に挙げた欄だけを書き換える。欄の形は ../schema/schema.ts の PARAMS。
base:
  methods: [{ name: ae-latent5-sindy, from: ae-sindy, d: 5 }]
  groupings: [m+h+n+a+b+c]
  train: { target: traub19, duration: 1000 }
  series: [traub-19comp-steady]
vary: []
runs:
  neuro2026-rerun:
    description: NEURO2026 で発表した形（6 ゲートを 1 つの AutoEncoder で潜在 5 本へ縮め、右辺を SINDy で同定する。19 区画の軌道で学習する）を今の研究コードで回し直し、19 区画の soma を置き換えて発表時の結果と比べる。
