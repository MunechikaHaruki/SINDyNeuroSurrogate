---
description: 元のモデルと縮約を GPU に並べ、VRAM とレジスタを測る実験群
---
# 一段目（presets.json の base と部品）の上に、この群の基準 base を重ねる。実験は vary に挙げた欄だけを書き換える。欄の形は ../schema/schema.ts の PARAMS。
# benches は GPU で測る系列。その系列で元のモデルと実験のモデルを全部測る。
base:
  methods: [kam, pca-sindy]
  groupings: [h+n]
  cells: [1024, 1048576]
  ncu: true
vary: [methods, train, series, benches, cells]
runs:
  gpu-memory:
    series: [traub-1comp-steady, traub-19comp-steady@soma, traub-19comp-steady@na-dr]
    benches: [traub-1comp-steady, traub-19comp-steady@soma, traub-19comp-steady@na-dr]
  test-gpu:
    methods: [kam]
    train: { duration: 1000 }
    cells: [1024]
    series:
      - { name: traub-1comp-steady-test, from: traub-1comp-steady, duration: 100.0, sweep: { value: [0, 10] } }
    benches: [traub-1comp-steady-test]
