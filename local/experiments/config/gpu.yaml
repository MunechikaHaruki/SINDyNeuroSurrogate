---
description: 元のモデルと縮約を GPU に並べ、VRAM とレジスタを測る実験群
---
# 実験ごとに欄を全部書く。learners は学習器の名前 <圧縮器>-<右辺>[-d<潜在>][-absorb-<ゲート>]（圧縮器と右辺が同じなら 1 語）。
# inputs は系列の基準（input.json）からの差分で、掃引 sweep: { <電流パラメータ>: [値...] } と置き換える区画 replace_targets も書く。系列の名前は <細胞>-<電流の種類>@<区画> と中身から付く。
# train は学習の電流への差分、bench の series は系列の名前。欄の形は ../schema/schema.ts。実験どうしで同じものは YAML のアンカー（&名前・*名前）で使い回す。
# bench は GPU の実測。系列 series ごとに元のモデルと実験のモデルを全部測る（掃引の点を細胞に順に割り当てる）。
experiments:
  gpu-memory:
    learners: [kam, pca-sindy]
    groupings: [h+n]
    inputs:
      - { sweep: { value: [0, 2.5, 5, 7.5, 10] } }
      - &steady-19 { spec: { target: traub19 }, sweep: { value: [0, 2.5, 5, 7.5, 10] } }
      - { <<: *steady-19, replace_targets: [c05, c07, soma, c09, c11] }
    bench:
      series: [traub-steady@soma, traub19-steady@soma, traub19-steady@c05+c07+soma+c09+c11]
      cells: [1024, 1048576]
      ncu: true
  test-gpu:
    learners: [kam]
    train: { current_params: { duration: 1000 } }
    groupings: [h+n]
    inputs:
      - { spec: { current_params: { duration: 100.0 } }, sweep: { value: [0, 10] } }
    bench: { series: [traub-steady@soma], cells: [1024], ncu: true }
