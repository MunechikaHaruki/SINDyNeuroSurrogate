---
description: 元のモデルと縮約を GPU に並べ、VRAM とレジスタを測る実験群
---
# 基準のファイル（parts/ の学習器、inputs/ の系列。送る形そのまま）を名前か差分 { name, from, ...差分 } で指す。part・input はどの学習器・系列にも重ねる差分。欄の形は ../schema/schema.ts の FIELDS。
# benches は GPU で測る系列。その系列で元のモデルと実験のモデルを全部測る。
base:
  parts: [kam, pca-sindy]
  groupings: [h+n]
  cells: [1024, 1048576]
  ncu: true
runs:
  gpu-memory:
    inputs:
      - traub-1comp-steady
      - { name: traub-19comp-steady@soma, from: traub-19comp-steady }
      - { name: traub-19comp-steady@na-dr, from: traub-19comp-steady, replace_targets: [c05, c07, soma, c09, c11] }
    benches: [traub-1comp-steady, traub-19comp-steady@soma, traub-19comp-steady@na-dr]
  test-gpu:
    parts: [kam]
    part: { data: { current_params: { duration: 1000 } } }
    cells: [1024]
    inputs:
      - {
          name: traub-1comp-steady-test,
          from: traub-1comp-steady,
          spec: { current_params: { duration: 100.0 } },
          values: [0, 10],
        }
    benches: [traub-1comp-steady-test]
