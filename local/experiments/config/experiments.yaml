---
description: 実験の宣言。群ごとの実験の、学習器・群分け・系列。実験を足す・直すときに開く
---
# 群（冊のページ）→ 実験 → 欄。欄の形は ../schema/schema.ts、名前の決まり方は AGENTS.md。
# learners は学習器の名前 <圧縮器>-<右辺>[-d<潜在>][-absorb-<ゲート>]、inputs は系列の基準（input.json）からの差分で、掃引 sweep と置き換える区画 replace_targets も書く。
# 系列の名前は <細胞>-<電流の種類>@<区画> と中身から付き、bench の series はその名前で指す。train は学習の電流への差分。同じものは YAML のアンカー（&名前・*名前・<<:）で使い回す。
groups:
  1comp:
    description: 単一区画の Traub で、群分けと縮約の仕方を比べる実験群
    experiments:
      all-groupings-1comp:
        learners: [kam, kam-absorb-m, pca-sindy, ae-sindy]
        groupings: { all: [h, n, a, c] }
        inputs:
          - &steady { sweep: &values { value: [0, 2.5, 5, 7.5, 10] } }
      fluctuating-input-1comp:
        learners: &three [kam, pca-sindy, ae-sindy]
        groupings: [h+n]
        inputs:
          - *steady
          - spec: { current_type: random&kistler, current_params: { duration: 2000, mean: 0, seed: 0 } }
            sweep: { sigma: [10, 15, 20, 30] }
      test-1comp:
        learners: *three
        train: &short-train { current_params: { duration: 1000 } }
        groupings: [h+n_a+c]
        inputs:
          - &steady-test { spec: { current_params: { duration: 100.0 } }, sweep: { value: [0, 10] } }
  19comp:
    description: 単一区画で学習した縮約を Traub の 19 区画に当てる実験群
    experiments:
      transfer-to-19comp:
        learners: *three
        groupings: [h+n, a+c]
        inputs:
          - &steady-19 { spec: { target: traub19 }, sweep: *values }
          - &na-dr { <<: *steady-19, replace_targets: [c05, c07, soma, c09, c11] }
      test-19comp:
        learners: *three
        train: *short-train
        groupings: [h+n]
        inputs:
          - { spec: { target: traub19, current_params: { duration: 100.0 } }, sweep: { value: [0, 10] } }
  gpu:
    description: 元のモデルと縮約を GPU に並べ、VRAM とレジスタを測る実験群
    experiments:
      gpu-memory:
        learners: [kam, pca-sindy]
        groupings: [h+n]
        inputs: [*steady, *steady-19, *na-dr]
        bench:
          series: [traub-steady@soma, traub19-steady@soma, traub19-steady@c05+c07+soma+c09+c11]
          cells: [1024, 1048576]
          ncu: true
      test-gpu:
        learners: [kam]
        train: *short-train
        groupings: [h+n]
        inputs: [*steady-test]
        bench: { series: [traub-steady@soma], cells: [1024], ncu: true }
  neuro2026:
    description: NEURO2026 で発表した形を今の研究コードで回し直す実験群
    experiments:
      neuro2026-rerun:
        learners: [ae-sindy-d5]
        train: { target: traub19, current_params: { duration: 1000 } }
        groupings: [m+h+n+a+b+c]
        inputs: [*steady-19]
