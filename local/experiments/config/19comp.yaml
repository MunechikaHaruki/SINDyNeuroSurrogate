---
description: 単一区画で学習した縮約を Traub の 19 区画に当てる実験群
---
# 基準のファイル（parts/ の学習器、inputs/ の系列。送る形そのまま）を名前か差分 { name, from, ...差分 } で指す。part・input はどの学習器・系列にも重ねる差分。欄の形は ../schema/schema.ts の FIELDS。
base:
  parts: [kam, pca-sindy, ae-sindy]
  groupings: [h+n, a+c]
  inputs: [traub-19comp-steady]
runs:
  transfer-to-19comp:
    replace: { soma: [soma], na-dr: [c05, c07, soma, c09, c11] }
  test-19comp:
    part: { data: { current_params: { duration: 1000 } } }
    groupings: [h+n]
    inputs:
      - {
          name: traub-19comp-steady-test,
          from: traub-19comp-steady,
          spec: { current_params: { duration: 100.0 } },
          values: [0, 10],
        }
