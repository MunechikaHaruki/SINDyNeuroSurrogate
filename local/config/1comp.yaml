---
description: 単一区画の Traub で、群分けと縮約の仕方を比べる実験群。判定は 1comp.checks.ts
---
# どの run にも共通の設定。run に書いた欄だけが置き換わる。形は ../experiments/schema.ts。
setup:
  methods: [ kam, kam-absorb-m, pca-sindy, ae-sindy ]
  series: [ traub-1comp-steady ]
runs:
  all-groupings-1comp:
    description: ゲート h, n, a, c の全部の群分けを KAM・PCA・AE で縮約し、定常電流の掃引で元のモデルの発火をどこまで再現するかを比べる。物差しは coincidence factor Γ（±Δ 以内で一致した発火の数を、偶然の一致を引いて正規化したもの。[Kistler et al. 1997](https://doi.org/10.1152/jn.1997.77.5.2390)）。
    gates: [ h, n, a, c ]
  fluctuating-input-1comp:
    description: h+n をまとめた KAM・PCA・AE が、定常電流の外の入力（Kistler 1997 の揺らぐ電流）でも元のモデルの発火を再現するかを、定常電流と同じ物差しで比べる。
    methods: [ kam, pca-sindy, ae-sindy ]
    groupings: [ h+n ]
    series: [ traub-1comp-steady, traub-1comp-kistler ]
