# 拡張。縮約をマルチコンパートメントと GPU へ広げる。判定を持たず、回す系列と GPU の実測だけを書く。形は schema.ts。
transfer-to-19comp:
  description: h+n と a+c をまとめた KAM・PCA・AE の縮約（単一区画で学習）を Traub の 19 区画に当て、soma だけを置き換えるときと、Na と DR を持つ 5 区画を置き換えるときで、元のモデルの発火をどこまで再現するかを見る。
  groupings: [ h+n, a+c ]
  methods: [ kam, pca-sindy, ae-sindy ]
  series: [ traub-19comp-steady-replace-soma, traub-19comp-steady-replace-na-dr ]
gpu-memory:
  description: 単一区画と 19 区画の Traub を、元のモデル・h+n の KAM・h+n の PCA と SINDy のサロゲート（19 区画では soma だけ、または Na と DR を持つ 5 区画を置き換える）で、細胞を並べ、刻みごとに全細胞をそろえて GPU で回す。1 スレッドが 1 区画を持つ。刻みをまたいで持ち越す状態（V、潜在 z、縮約しなかったゲート）は VRAM に置いて毎刻み読み書きし、刻みの中だけで使う値（z から作り直すゲートなど）はキャッシュ（レジスタ）に置く。ncu で 1 刻みの VRAM の読み書きの量とレジスタの数、レジスタから溢れた分を測り、持ち越す状態の少なさが VRAM の量に現れるかをモデルごとに確かめる。
  groupings: [ h+n ]
  methods: [ kam, pca-sindy ]
  series: [ traub-1comp-steady, traub-19comp-steady-replace-soma, traub-19comp-steady-replace-na-dr ]
  benches:
    - models: [ original, kam.h+n, pca-sindy.h+n ]
      series: traub-1comp-steady
      cells: [ 1024, 1048576 ]
      ncu: true
    - models: [ original, kam.h+n, pca-sindy.h+n ]
      series: traub-19comp-steady-replace-soma
      cells: [ 1024, 1048576 ]
      ncu: true
    - models: [ original, kam.h+n, pca-sindy.h+n ]
      series: traub-19comp-steady-replace-na-dr
      cells: [ 1024, 1048576 ]
      ncu: true
