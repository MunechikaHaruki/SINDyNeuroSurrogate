---
description: 元のモデルと縮約を GPU に並べ、VRAM とレジスタを測る実験群
---
# どの run にも共通の設定。run に書いた欄だけが置き換わる。形は ../evaluation/experiments/schema.ts。
# benches は GPU で測る系列。その系列で元のモデルと run の学習 run を全部測る。
setup:
  methods: [ kam, pca-sindy ]
  groupings: [ h+n ]
  cells: [ 1024, 1048576 ]
  ncu: true
runs:
  gpu-memory:
    description: 単一区画と 19 区画の Traub を、元のモデル・h+n の KAM・h+n の PCA と SINDy のサロゲート（19 区画では soma だけ、または Na と DR を持つ 5 区画を置き換える）で、細胞を並べ、刻みごとに全細胞をそろえて GPU で回す。1 スレッドが 1 区画を持つ。刻みをまたいで持ち越す状態（V、潜在 z、縮約しなかったゲート）は VRAM に置いて毎刻み読み書きし、刻みの中だけで使う値（z から作り直すゲートなど）はキャッシュ（レジスタ）に置く。ncu で 1 刻みの VRAM の読み書きの量とレジスタの数、レジスタから溢れた分を測り、持ち越す状態の少なさが VRAM の量に現れるかをモデルごとに確かめる。
    series: [ traub-1comp-steady, traub-19comp-steady-replace-soma, traub-19comp-steady-replace-na-dr ]
    benches: [ traub-1comp-steady, traub-19comp-steady-replace-soma, traub-19comp-steady-replace-na-dr ]
