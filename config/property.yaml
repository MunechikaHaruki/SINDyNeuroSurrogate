# 性質の発見。縮約が定常電流の外の入力でも再現するかなど、縮約の性質を確かめる。形は schema.ts、判定は checks.ts。
fluctuating-input-1comp:
  description: h+n をまとめた KAM・PCA・AE が、定常電流の外の入力（Kistler 1997 の揺らぐ電流）でも元のモデルの発火を再現するかを、定常電流と同じ物差しで比べる。
  groupings: [ h+n ]
  methods: [ kam, pca-sindy, ae-sindy ]
  claims:
    fluctuating-input-keeps-timing-better:
      on: [ traub-1comp-steady, traub-1comp-kistler ]
      claim: h+n をまとめた縮約は、どの仕方でも Kistler 1997 の揺らぐ電流のほうが定常電流より元の発火の時刻に合う。最も強い揺らぎで時刻まで合うのは KAM だけである。
