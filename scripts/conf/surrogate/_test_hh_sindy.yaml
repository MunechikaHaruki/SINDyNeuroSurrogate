# @package _global_
# テスト専用プリセット (自己完結)。素体 hh の学習構造を直接書き下す。本番 preset は
# results/obsolete へ退避したので defaults 継承しない (移動で壊れないため)。
# smoke 用に学習構造 (sweep 軸で振れる ansatz/preprocessor) と電流長を固定する。
surrogate:
  spec:
    comp_type: hh
    surrogate_type: sindy
    # 決定的で速い pca に固定 (AE は 1000 epoch でテスト時間が数倍、乱数初期化で
    # fit 品質もブレる)。AE 経路自体は test_hh_ae が薄く踏む。
    preprocessor_type: pca
    n_components: 3 # 式構造/描画の代表。latent 複数の方が列構造が厳しい
    datasets:
      target: hh
      current_type: train
      current_params:
        duration: 180 # 本番は 9000。smoke は shape/有限性のみ見るので短縮
  closure:
    library_specs:
      - type: hh_gate_forward
      - type: hh_gate_backward
      - type: hh_gate_forward_product
      - type: hh_gate_backward_product
      - type: basis
