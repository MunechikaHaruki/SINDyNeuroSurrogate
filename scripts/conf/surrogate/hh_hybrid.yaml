# @package _global_
surrogate:
  spec:
    comp_type: hh  # 置換対象のコンパートメント種類
    surrogate_type: hybrid
    preprocessor_type: pca
    n_components: 2  # 潜在方程式の次元
    datasets:
      target: hh
      current_type: train
  ansatz:
    physics_type: hh
  closure:
    library_specs:
      - type: hh_gate_forward
      - type: hh_gate_backward
      - type: hh_gate_forward_product
      - type: hh_gate_backward_product
      - type: basis

hydra:
  sweeper:
    params:
      surrogate.spec.n_components: 1,2
      surrogate.spec.preprocessor_type: pca
