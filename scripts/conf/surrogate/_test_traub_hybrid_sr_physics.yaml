# @package _global_
# テスト専用プリセット (自己完結)。_test_traub_hybrid の S,R physics 版 (学習ゲート
# 8 → 6)。physics 分割を preset で振れること = 状態次元/初期値/置換が両分割で通る
# ことを踏む。defaults 継承せず全構造を直接書き下す (physics_type だけが違い)。
surrogate:
  meta:
    comp_type: traub
    surrogate_type: hybrid
    preprocessor_type: pca
    n_components: 5
    physics_type: traub_sr_physics
    datasets:
      model_name: traub
      current_type: train
      current_params:
        duration: 180 # 本番は 9000。smoke は shape/有限性のみ見るので短縮
  ansatz:
    library_specs:
      - type: traub_gate_forward
      - type: traub_gate_backward
      - type: traub_gate_forward_product
      - type: traub_gate_backward_product
      - type: basis
