# @package _global_
# 教師データ = 19-comp MC の全 comp 軌道 (置換対象 = traub 型 comp 全部)。
surrogate:
  spec:
    comp_type: traub  # 置換対象のコンパートメント種類
    surrogate_type: hybrid
    preprocessor_type: pca
    n_components: 6  # 潜在方程式の次元
    datasets:
      target: traub19
      current_type: train
      # 19 comp 全部が学習軌道になる (`scope.train_comp_ids`) → 1 軌道を
      # 短くして総サンプル数を単体モデル (duration=9000) と同程度に揃える。
      current_params:
        duration: 1000
  ansatz:
    library_specs:
      - type: traub_gate_forward
      - type: traub_gate_backward
      - type: traub_gate_forward_product
      - type: traub_gate_backward_product
      - type: basis

hydra:
  sweeper:
    params:
      surrogate.spec.n_components: 6,7,8
      surrogate.spec.preprocessor_type: pca
